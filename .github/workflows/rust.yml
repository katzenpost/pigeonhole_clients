name: rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cd rust && cargo clippy --release --all-targets -- -D warnings
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" sh -c 'cd rust && cargo test --release'
  reticulum-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The replica with Channel queries, katzenpost/pigeonhole_rns#3; it brings rns and hpqc.
      - run: pip install "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns@channel-mode"
      - run: cd rust && cargo clippy --release --all-targets --features reticulum-rs -- -D warnings
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" sh -c 'cd rust && timeout 1200 cargo test --release --features reticulum-rs'
      # Reticulum-rs against Python RNS, and the backend against a pigeonhole_rns replica.
      - run: cd rust && PYTHON=python timeout 600 cargo test --release --features reticulum-rs --test reticulum_rs -- --ignored --test-threads 1
  reticulum-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # hpqc builds highctidh from source.
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: pip install -e "py[reticulum]" "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns" "hpqc @ git+https://github.com/katzenpost/hpqc@katzenqt1-v4#subdirectory=py"
      - run: cd rust && cargo clippy --release --all-targets --features reticulum-py -- -D warnings
      - run: mkdir -p "$RUNNER_TEMP/tmp" && cd rust && TMPDIR="$RUNNER_TEMP/tmp" PYO3_PYTHON="$(which python)" PYTHONPATH="$GITHUB_WORKSPACE/py" cargo test --release --features reticulum-py --test transport_reticulum_py
      - name: Interop with a real pigeonhole_rns replica on loopback
        run: mkdir -p "$RUNNER_TEMP/tmp" && cd rust && TMPDIR="$RUNNER_TEMP/tmp" PYTHON="$(which python)" PYO3_PYTHON="$(which python)" PYTHONPATH="$GITHUB_WORKSPACE/py" timeout 900 cargo test --release --features reticulum-py --test transport_reticulum_py_mesh -- --ignored
      - name: Push against a real pigeonhole_rns replica on loopback
        run: mkdir -p "$RUNNER_TEMP/tmp" && cd rust && TMPDIR="$RUNNER_TEMP/tmp" PYTHON="$(which python)" PYO3_PYTHON="$(which python)" PYTHONPATH="$GITHUB_WORKSPACE/py" timeout 1500 cargo test --release --features reticulum-rs,reticulum-py --test reticulum_push -- --ignored
