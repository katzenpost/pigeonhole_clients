name: python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/verify-testdata.sh
      # hpqc builds highctidh from source.
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: pip install -e "py[test,reticulum]" "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns" "hpqc @ git+https://github.com/katzenpost/hpqc@4732d7fb7e6328407f69a5cea0dfb5e9eca308f7#subdirectory=py"
      - run: cd py && pytest -q
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenqt
          path: katzenqt
          fetch-depth: 0
      - run: py/scripts/verify-member.sh katzenqt
