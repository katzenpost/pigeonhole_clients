[package]
name = "pigeonhole_protocols"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["David Stainton"]
homepage = "https://katzenpost.network"
description = "Protocols over Katzenpost's Pigeonhole storage: group chat, and services with their clients"
documentation = "https://docs.rs/pigeonhole_protocols/latest/pigeonhole_protocols/"
repository = "https://github.com/katzenpost/pigeonhole_protocols"
license = "AGPL-3.0-only"
readme = "../README.md"
keywords = ["katzenpost", "pigeonhole", "mixnet", "group-chat"]
include = ["/src/**"]

[dependencies]
# The sans-io katzenqt1 core needs only alloc; without the std feature it builds no_std, with
# hashbrown's maps for std's.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
# katzenpost/thin_client#100: the daemon's NIKE and sealed box requests.
katzenpost_thin_client = { git = "https://github.com/katzenpost/thin_client", rev = "98ff985ad348156eccbe7d3f4c4849a47041f2d3", optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", optional = true }
ciborium = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
hkdf = { version = "0.12", optional = true }
log = { version = "0.4", optional = true }
subtle = { version = "2", optional = true }
thiserror = { version = "2", optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
ed25519-dalek = { version = "2", optional = true }
# Falcon-padded-512, byte compatible with katzenpost/falcon; fpemu: the same signature on every platform.
falcon-rs = { version = "0.3.1", default-features = false, features = ["fpemu"], optional = true }
hex = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
indexmap = { version = "2", default-features = false }
memsec = { version = "0.7", default-features = false }
rand = { version = "0.8", optional = true }
redb = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_cbor = { version = "0.11", optional = true }
serde_json = { version = "1", features = ["arbitrary_precision"], optional = true }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
# berlinmesh/reticulum, for the native mesh transport.
reticulum-announce = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", features = ["rustcrypto"], optional = true }
reticulum-channel = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-client = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-id = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", features = ["rustcrypto"], optional = true }
reticulum-iface = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-ip-iface = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-link = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", features = ["rustcrypto"], optional = true }
reticulum-msgpack = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-packet = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
reticulum-router = { git = "https://git.emcomm.cc/berlinmesh/reticulum", rev = "6669dc5d220e647510701599ed0292d4abd38715", optional = true }
# BACAP in Rust, CTIDH via highctidh-rs; pinned to unmerged hpqc#159 (no_std), which pins highctidh-rs#2.
hpqc = { git = "https://github.com/katzenpost/hpqc", rev = "0593c80f32f09eb17fbeb02bf0b84b3286524663", optional = true }
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[dev-dependencies]
# The shared wire vectors, read without std too.
hex = "0.4"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[features]
default = ["std"]
# Everything but the sans-io katzenqt1 core (`protocols::katzenqt1::{engine, member, wire}`):
# its client, the transports, services, CLIs.
std = ["dep:katzenpost_thin_client", "base64/std", "blake2/std", "dep:chacha20poly1305", "dep:ciborium", "dep:clap", "dep:env_logger", "dep:hkdf", "dep:log", "dep:subtle", "dep:thiserror", "dep:tokio-util", "dep:ed25519-dalek", "dep:falcon-rs", "dep:libc", "indexmap/std", "memsec/default", "dep:rand", "dep:redb", "dep:serde", "dep:serde_cbor", "trace", "sha2/std", "dep:sha3", "dep:tempfile", "dep:tokio"]
# katzenqt's trace format, `protocols::katzenqt1::member::trace`, and its replays.
trace = ["dep:serde_json", "dep:hex"]
# BACAP's sealing and opening of boxes and contact vouchers, `protocols::katzenqt1::boxes`, with hpqc.
bacap = ["dep:hpqc"]
# The Zulip bridge, `zulip-bridge`.
zulip = ["std", "dep:reqwest"]
# Pigeonhole over Reticulum natively, `transport::reticulum_rs`, on berlinmesh/reticulum.
reticulum-rs = ["std", "bacap", "dep:reticulum-announce", "dep:reticulum-channel", "dep:reticulum-client", "dep:reticulum-id", "dep:reticulum-iface", "dep:reticulum-ip-iface", "dep:reticulum-link", "dep:reticulum-msgpack", "dep:reticulum-packet", "dep:reticulum-router", "dep:getrandom"]
# The Reticulum mesh through the Python transport, embedding CPython.
reticulum-py = ["std", "dep:pyo3"]

[[example]]
name = "chat"
required-features = ["std"]

[[bin]]
name = "katzenqt1-rs"
path = "src/bin/katzenqt1.rs"
required-features = ["std"]

[[bin]]
name = "pigeonhole-cp"
path = "src/bin/pigeonhole_cp.rs"
required-features = ["std"]

[[bin]]
name = "status-bot"
path = "src/bin/status_bot.rs"
required-features = ["std"]

[[bin]]
name = "zulip-bridge"
path = "src/bin/zulip_bridge.rs"
required-features = ["zulip"]

[[test]]
name = "transport_reticulum_py"
required-features = ["reticulum-py"]

[[test]]
name = "transport_reticulum_py_mesh"
required-features = ["reticulum-py"]

[[test]]
name = "reticulum_rs_join"
required-features = ["reticulum-rs", "reticulum-py"]

[[test]]
name = "reticulum_push"
required-features = ["reticulum-rs", "reticulum-py"]

[[bin]]
name = "ph"
path = "src/bin/ph.rs"
required-features = ["std"]
