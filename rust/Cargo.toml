[package]
name = "pigeonhole_protocols"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["David Stainton"]
homepage = "https://katzenpost.network"
description = "Protocols over Katzenpost's Pigeonhole storage: group chat, and services with their clients"
documentation = "https://docs.rs/pigeonhole_protocols/latest/pigeonhole_protocols/"
repository = "https://github.com/katzenpost/pigeonhole_protocols"
license = "AGPL-3.0-only"
readme = "../README.md"
keywords = ["katzenpost", "pigeonhole", "mixnet", "group-chat"]
include = ["/src/**"]

[dependencies]
# katzenpost/thin_client#100: the daemon's NIKE and sealed box requests.
katzenpost_thin_client = { git = "https://github.com/katzenpost/thin_client", rev = "98ff985ad348156eccbe7d3f4c4849a47041f2d3" }
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
hkdf = "0.12"
log = "0.4"
subtle = "2"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
ed25519-dalek = "2"
# Falcon-padded-512, byte compatible with katzenpost/falcon; fpemu: the same signature on every platform.
falcon-rs = { version = "0.3.1", default-features = false, features = ["fpemu"] }
hex = "0.4"
libc = "0.2"
indexmap = "2"
memsec = "0.7"
rand = "0.8"
redb = "2"
serde_cbor = "0.11"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
# Beechat's Reticulum-rs, for the native mesh transport.
reticulum = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs", rev = "151e3b6c77a8c7d33fafa3971a084ae02510ef39", optional = true }
# BACAP in Rust, CTIDH via highctidh-rs.
hpqc = { git = "https://github.com/katzenpost/hpqc", rev = "4732d7fb7e6328407f69a5cea0dfb5e9eca308f7", optional = true }
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[features]
# The Zulip bridge, `zulip-bridge`.
zulip = ["dep:reqwest"]
# Pigeonhole over Reticulum natively, `transport::reticulum_rs`.
reticulum-rs = ["dep:reticulum", "dep:hpqc", "dep:getrandom"]
# The Reticulum mesh through the Python transport, embedding CPython.
reticulum-py = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "katzenqt1-rs"
path = "src/bin/katzenqt1.rs"

[[bin]]
name = "status-bot"
path = "src/bin/status_bot.rs"

[[bin]]
name = "zulip-bridge"
path = "src/bin/zulip_bridge.rs"
required-features = ["zulip"]

[[test]]
name = "transport_reticulum_py"
required-features = ["reticulum-py"]

[[test]]
name = "transport_reticulum_py_mesh"
required-features = ["reticulum-py"]

[[test]]
name = "reticulum_rs_join"
required-features = ["reticulum-rs", "reticulum-py"]

[[test]]
name = "reticulum_push"
required-features = ["reticulum-rs", "reticulum-py"]

[[bin]]
name = "ph"
path = "src/bin/ph.rs"
